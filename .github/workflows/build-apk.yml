name: Build APP LEO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -o APP_LEO_Android_v0.2.1.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create temporary Firebase config for compile check
        working-directory: APP_LEO_Android_v0_2
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1234567890","project_id":"app-leo-build-check","storage_bucket":"app-leo-build-check.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef1234567890abcdef","android_client_info":{"package_name":"com.leo.manutencao"}},"api_key":[{"current_key":"BUILD_ONLY_NOT_A_REAL_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
      - name: Build debug APK
        working-directory: APP_LEO_Android_v0_2
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-leo-debug-apk
          path: APP_LEO_Android_v0_2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
